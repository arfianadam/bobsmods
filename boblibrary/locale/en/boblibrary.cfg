[mod-setting-description]
bobmods-library-recipe-cleanup=When enabled, during the final-fixes stage of loading, Ingredients of Recipes will be scanned for duplicate, and invalid values.
bobmods-library-crafting-speed-multiplier=Assemblers, furnaces, chemical plants, refineries, distilleries, air and water pumps and greenhouses. Vanilla and Bob's machines only. 1 is unchanged.
bobmods-library-electric-furnace-speed-multiplier=Applied to electric furnaces on top of the crafting speed multiplier. 1 is unchanged.
bobmods-library-mining-speed-multiplier=Mining drills, area drills, pumpjacks and water miners. Vanilla and Bob's only. 1 is unchanged.
bobmods-library-research-speed-multiplier=Labs. Vanilla and Bob's only. 1 is unchanged.
bobmods-library-inserter-speed-multiplier=Inserter rotation and extension speed. Vanilla and Bob's only. 1 is unchanged.
bobmods-library-pump-speed-multiplier=Pumps and offshore pumps. Vanilla and Bob's only. 1 is unchanged.
bobmods-library-power-multiplier=Generators, boilers, reactors, solar panels and their fuel use, plus solar and generator equipment. 1 is unchanged.
bobmods-library-stack-size-multiplier=Item stack sizes. Items that stack to 1 stay 1. 1 is unchanged.
bobmods-library-inventory-size-multiplier=Chests, cargo wagons, cars and spidertrons. 1 is unchanged.
bobmods-library-fluid-capacity-multiplier=Storage tanks, pipes and fluid wagons. 1 is unchanged.
bobmods-library-belt-speed-multiplier=Belts, undergrounds, splitters, lane splitters and loaders. 1 is unchanged.
bobmods-library-underground-reach-multiplier=Underground belt and pipe-to-ground distance. 1 is unchanged.
bobmods-library-pole-reach-multiplier=Electric pole wire reach (up to 64) and supply area. 1 is unchanged.
bobmods-library-battery-capacity-multiplier=Accumulators and battery equipment. 1 is unchanged.
bobmods-library-robot-multiplier=Logistic and construction robot speed, cargo size and battery. 1 is unchanged.
bobmods-library-roboport-multiplier=Roboport and roboport equipment coverage, slots, charging pads and charging power. 1 is unchanged.
bobmods-library-module-bonus-multiplier=Module bonuses. Penalties stay as they are. 1 is unchanged.
bobmods-library-beacon-effectivity-multiplier=How much of a module's effect a beacon passes on. 1 is unchanged.
bobmods-library-beacon-range-multiplier=Beacon reach, up to 64 tiles. 4 turns the vanilla 3 tiles into 12. 1 is unchanged.
bobmods-library-turret-damage-multiplier=Turrets, vehicle guns and personal laser defense. 1 is unchanged.
bobmods-library-turret-fire-rate-multiplier=Turrets, vehicle guns and personal laser defense. 1 is unchanged.
bobmods-library-turret-range-multiplier=Turrets, vehicle guns and personal laser defense, with matching shell and beam reach. 1 is unchanged.
bobmods-library-turret-turn-speed-multiplier=Turrets, vehicle turrets and artillery. 1 is unchanged.
bobmods-library-uranium-235-percent=Chance for uranium processing to give uranium-235 instead of uranium-238. Vanilla is 0.7.
